name: Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Xre.App/Xre.App.csproj
      - name: Build
        run: dotnet build src/Xre.App/Xre.App.csproj -c Release --no-restore
      - name: Publish Windows application
        run: dotnet publish src/Xre.App/Xre.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package tester ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath Xactimate-Reconstruction-Estimator-win-x64-preview.zip -Force
          $hash = (Get-FileHash Xactimate-Reconstruction-Estimator-win-x64-preview.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Xactimate-Reconstruction-Estimator-win-x64-preview.zip" | Set-Content SHA256SUMS.txt
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: Xactimate-Reconstruction-Estimator-win-x64-preview
          path: publish/
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "preview-build-${{ github.run_number }}"
          gh release create $tag Xactimate-Reconstruction-Estimator-win-x64-preview.zip SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Windows Tester Preview #${{ github.run_number }}" --notes "Automated unpriced reconstruction scope preview. Windows x64. Extract ZIP and launch Xre.App.exe. This preview is not a licensed Xactimate pricing integration. Review all quantities and scope items before use." --prerelease --latest=false
      - name: Run preview smoke tests (non-blocking)
        continue-on-error: true
        run: dotnet run --project tests/Xre.SmokeTests/Xre.SmokeTests.csproj -c Release
